name: KafkaTestApp

services:
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'false'
      KAFKA_CLUSTERS_0_NAME: FirstCluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092
      KAFKA_CLUSTERS_1_NAME: SecondCluster
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: kafka-4:9092
    networks:
      - broker-network

  kafka-1:
    image: confluentinc/cp-kafka:7.9.10
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper-1:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_NODE_ID=11
    domainname: kafka-1
    ports:
      - 9092:9092
    depends_on:
      - zookeeper-1
    networks:
      - broker-network
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    restart: on-failure

  kafka-2:
    image: confluentinc/cp-kafka:7.9.10
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper-1:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_NODE_ID=12
    domainname: kafka-2
    depends_on:
      - zookeeper-1
    networks:
      - broker-network
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    restart: on-failure

  kafka-3:
    image: confluentinc/cp-kafka:7.9.10
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper-1:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_NODE_ID=13
    domainname: kafka-3
    depends_on:
      - zookeeper-1
    networks:
      - broker-network
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    restart: on-failure

  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.9.10
    deploy:
      mode: global
      replicas: 1
    domainname: zookeeper-1
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
    networks:
      - broker-network
    volumes:
      - zookeeper-1-data:/var/lib/zookeeper/data
      - zookeeper-1-log:/var/lib/zookeeper/log

  kafka-4:
    image: confluentinc/cp-kafka:7.9.10
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper-2:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-4:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_NODE_ID=21
    domainname: kafka-4
    depends_on:
      - zookeeper-2
    networks:
      - broker-network

  kafka-5:
    image: confluentinc/cp-kafka:7.9.10
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper-2:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-5:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_NODE_ID=22
    domainname: kafka-5
    depends_on:
      - zookeeper-2
    networks:
      - broker-network

  kafka-6:
    image: confluentinc/cp-kafka:7.9.10
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper-2:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-6:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_NODE_ID=23
    domainname: kafka-6
    depends_on:
      - zookeeper-2
    networks:
      - broker-network

  zookeeper-2:
    image: zookeeper:3.9.6
    deploy:
      mode: global
      replicas: 1
    domainname: zookeeper-2
    networks:
      - broker-network

  topic-initializer:
    image: confluentinc/cp-kafka:7.9.10
    entrypoint: 
    - /bin/sh
    - -c
    command:
    - |
      kafka-topics --bootstrap-server kafka-1:9092 --create --topic orders-events --replication-factor 2 --partitions 2 || true && \
      kafka-topics --bootstrap-server kafka-1:9092 --create --topic refunds-events --replication-factor 2 --partitions 2 || true && \
      kafka-topics --bootstrap-server kafka-1:9092 --create --topic rewards-events --replication-factor 2 --partitions 2 || true && \
      kafka-topics --bootstrap-server kafka-1:9092 --create --topic tickets-events --replication-factor 2 --partitions 2 || true && \
      kafka-topics --bootstrap-server kafka-1:9092 --create --topic random-events --replication-factor 2 --partitions 2 || true
    networks:
      - broker-network
    depends_on:
      - kafka-1
  
  client-producer-orders:
    image: kafka-client:0.1
    profiles:
      - producers
    environment:
      - CLIENT_TOPIC_NAME=orders-events
      - CLIENT_CONNECT=kafka-1:9092
      - CLIENT_ROLE=producer
      - CLIENT_PERIOD=2000
    # depends_on:
    #   topic-initializer:
    #     condition: service_completed_successfully
    deploy:
      replicas: 5
    networks:
      - broker-network

  client-producer-refunds:
    image: kafka-client:0.1
    profiles:
      - producers
    environment:
      - CLIENT_TOPIC_NAME=refunds-events
      - CLIENT_CONNECT=kafka-1:9092
      - CLIENT_ROLE=producer
      - CLIENT_PERIOD=30000
    # depends_on:
    #   topic-initializer:
    #     condition: service_completed_successfully
    deploy:
      replicas: 2
    networks:
      - broker-network

  client-producer-rewards:
    image: kafka-client:0.1
    profiles:
      - producers
    environment:
      - CLIENT_TOPIC_NAME=rewards-events
      - CLIENT_CONNECT=kafka-1:9092
      - CLIENT_ROLE=producer
      - CLIENT_PERIOD=10000
    # depends_on:
    #   topic-initializer:
    #     condition: service_completed_successfully
    deploy:
      replicas: 1
    networks:
      - broker-network

  client-producer-tickets:
    image: kafka-client:0.1
    profiles:
      - producers
    environment:
      - CLIENT_TOPIC_NAME=tickets-events
      - CLIENT_CONNECT=kafka-1:9092
      - CLIENT_ROLE=producer
      - CLIENT_PERIOD=15000
    # depends_on:
    #   topic-initializer:
    #     condition: service_completed_successfully
    deploy:
      replicas: 1
    networks:
      - broker-network

  client-producer-random:
    image: kafka-client:0.1
    profiles:
      - producers
    environment:
      - CLIENT_TOPIC_NAME=random-events
      - CLIENT_CONNECT=kafka-1:9092
      - CLIENT_ROLE=producer
      - CLIENT_PERIOD=45000
    # depends_on:
    #   topic-initializer:
    #     condition: service_completed_successfully
    deploy:
      replicas: 2
    networks:
      - broker-network

  client-consumer-random:
    image: kafka-client:0.1
    profiles:
      - consumers
    environment:
      - CLIENT_TOPIC_NAME=random-events
      - CLIENT_CONNECT=kafka-1:9092
      - CLIENT_ROLE=consumer
      - CLIENT_PERIOD=1000
    # depends_on:
    #   topic-initializer:
    #     condition: service_completed_successfully
    deploy:
      replicas: 2
    networks:
      - broker-network
    restart: always

  client-consumer-tickets:
    image: kafka-client:0.1
    profiles:
      - consumers
    environment:
      - CLIENT_TOPIC_NAME=tickets-events
      - CLIENT_CONNECT=kafka-1:9092
      - CLIENT_ROLE=consumer
      - CLIENT_PERIOD=10000
    # depends_on:
    #   topic-initializer:
    #     condition: service_completed_successfully
    deploy:
      replicas: 1
    networks:
      - broker-network
    restart: always

  client-consumer-rewards:
    image: kafka-client:0.1
    profiles:
      - consumers
    environment:
      - CLIENT_TOPIC_NAME=rewards-events
      - CLIENT_CONNECT=kafka-1:9092
      - CLIENT_ROLE=consumer
      - CLIENT_PERIOD=8000
    # depends_on:
    #   topic-initializer:
    #     condition: service_completed_successfully
    deploy:
      replicas: 2
    networks:
      - broker-network
    restart: always

  client-consumer-refunds:
    image: kafka-client:0.1
    profiles:
      - consumers
    environment:
      - CLIENT_TOPIC_NAME=refunds-events
      - CLIENT_CONNECT=kafka-1:9092
      - CLIENT_ROLE=consumer
      - CLIENT_PERIOD=25000
    # depends_on:
    #   topic-initializer:
    #     condition: service_completed_successfully
    deploy:
      replicas: 2
    networks:
      - broker-network
    restart: always

  client-consumer-orders:
    image: kafka-client:0.1
    profiles:
      - consumers
    environment:
      - CLIENT_TOPIC_NAME=orders-events
      - CLIENT_CONNECT=kafka-1:9092
      - CLIENT_ROLE=consumer
      - CLIENT_PERIOD=1000
    # depends_on:
    #   topic-initializer:
    #     condition: service_completed_successfully
    deploy:
      replicas: 3
    networks:
      - broker-network
    restart: always

  mirror_maker:
    image: confluentinc/cp-kafka:7.9.10
    profiles:
      - mirroring
    entrypoint:
    - connect-mirror-maker
    environment:
      - KAFKA_LOG4J_OPTS=-Dlog4j.configuration=file:/etc/kafka/connect-log4j.properties
    volumes:
    - ./mm2.conf:/etc/kafka/connect-mirror-maker.properties
    - ./log4j.conf:/etc/kafka/connect-log4j.properties
    command:
    - /etc/kafka/connect-mirror-maker.properties
    networks:
      - broker-network

networks:
  broker-network:

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  zookeeper-1-data:
  zookeeper-1-log: