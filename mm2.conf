clusters = origin, destination
origin.bootstrap.servers = kafka-1:9092
destination.bootstrap.servers = kafka-4:9092

origin->destination.enabled = true
destination->origin.enabled = false

origin->destination.topics = .*
sync.topic.acls.enabled = false
replication.policy.class= org.apache.kafka.connect.mirror.IdentityReplicationPolicy
tasks.max = 5

origin->destination.groups = .*
origin->destination.checkpoints.topic.replication.factor=-1
origin->destination.sync.group.offsets.enabled = true
origin->destination.sync.group.offsets.interval.seconds = 5
origin->destination.emit.checkpoints.enabled = true
origin->destination.emit.checkpoints.interval.seconds = 10
origin->destination.emit.offset-syncs.enabled = true

errors.log.enable = true
errors.log.include.messages = true

origin->destination.consumer.poll.timeout.ms = 100000
origin->destination.offset.lag.max = 0